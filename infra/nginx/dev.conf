upstream api {
    server api:3000;
    keepalive 32;
}

upstream ai {
    server ai:8000;
    keepalive 16;
}

upstream dashboard {
    server dashboard:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    # ── Logging ──────────────────────────────────
    access_log /var/log/nginx/tracelab_access.log;
    error_log  /var/log/nginx/tracelab_error.log;

    # ── Request size limit (for file uploads) ────
    client_max_body_size 10M;

    # ── Security headers ──────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── NestJS API ────────────────────────────────
    location /api/ {
        proxy_pass         http://api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade        $http_upgrade;
        proxy_set_header   Connection     "upgrade";
        proxy_set_header   Host           $host;
        proxy_set_header   X-Real-IP      $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # ── FastAPI AI Service ────────────────────────
    location /ai/ {
        proxy_pass         http://ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host           $host;
        proxy_set_header   X-Real-IP      $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Swagger / API Docs (passthrough) ──────────
    location /api-docs {
        proxy_pass         http://api/api-docs;
        proxy_http_version 1.1;
        proxy_set_header   Host           $host;
    }

    # ── React Dashboard (catch-all) ───────────────
    location / {
        proxy_pass         http://dashboard/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade        $http_upgrade;
        proxy_set_header   Connection     "upgrade";
        proxy_set_header   Host           $host;
        proxy_cache_bypass $http_upgrade;
    }
}
